<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>OG Image — Мужская среда</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background: #000DC3;
      position: relative;
      color: #fff;
    }

    /* Dot grid */
    .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Пиксельные мужики справа — та же картинка, что в первом экране сайта */
    .art {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 640px;
      overflow: hidden;
    }
    .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70% center;
      opacity: 0.55;
      mask-image: linear-gradient(to right, transparent 0%, black 55%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 55%);
    }

    /* Затемнение слева, чтобы текст читался поверх фигурок */
    .vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0, 8, 140, 0.55) 0%, rgba(0, 8, 140, 0.25) 55%, transparent 80%);
    }

    .content {
      position: absolute;
      z-index: 2;
      inset: 64px 72px 60px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 34px;
      letter-spacing: 0.01em;
    }
    .brand__tag {
      font-family: 'Manrope', sans-serif;
      font-size: 21px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      padding: 7px 18px;
      border-radius: 100px;
    }

    .title {
      margin-top: auto;
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 88px;
      line-height: 1.04;
      letter-spacing: -0.005em;
      text-shadow: 0 4px 24px rgba(0, 0, 60, 0.35);
    }

    .facts {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      list-style: none;
    }
    .facts li {
      font-size: 24px;
      font-weight: 600;
      padding: 9px 20px;
      border-radius: 100px;
      background: rgba(0, 6, 110, 0.55);
      border: 1.5px solid rgba(255,255,255,0.22);
    }
    .facts li.accent {
      background: #fff;
      color: #000DC3;
      border-color: #fff;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="art"><img src="assets/images/hero.webp" alt="" /></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="brand">
      МУЖСКАЯ СРЕДА
      <span class="brand__tag">Онлайн-группа для мужчин</span>
    </div>

    <h1 class="title">Друзья есть.<br />А поговорить<br />не&nbsp;с&nbsp;кем</h1>

    <ul class="facts">
      <li>9 встреч в Zoom</li>
      <li>Ведут психолог и психиатр</li>
      <li class="accent">Старт 18 ноября</li>
    </ul>
  </div>
</body>
</html>
